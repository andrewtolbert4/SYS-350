name: Terraform CI/CD

on:
  push:
    branches: [cicd-floci]
  pull_request:
    branches: [cicd-floci]

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize
        run: terraform init -input=false

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Start floci
        run: |
          docker run -d --name floci -p 4566:4566 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e FLOCI_SERVICES_UI_ENABLED=false \
            floci/floci:latest
          echo "Waiting for floci..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4566/_floci/health > /dev/null; then
              echo "floci is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "floci did not become healthy in time" >&2
          exit 1

      - name: Plan
        run: terraform plan -no-color -input=false -out=tfplan

      - name: Apply
        if: github.event_name == 'push'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Build Lambda package
        run: cd lambda && zip ../lambda.zip lambda_function.py

      - name: Verify S3 website
        if: github.event_name == 'push'
        run: |
          curl -sf "http://localhost:4566/${TF_VAR_student_name}-course-website/index.html" | grep "Hello from S3"

      - name: Verify DynamoDB and Lambda
        if: github.event_name == 'push'
        run: |
          aws dynamodb list-tables --endpoint-url http://localhost:4566
          aws lambda list-functions --endpoint-url http://localhost:4566
